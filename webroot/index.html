<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>DSHA 保活</title>
    <style>
        :root {
            --bg: #0e1014;
            --card: #171a21;
            --card2: #1d2129;
            --line: #262b35;
            --fg: #e6e9ef;
            --dim: #8b93a3;
            --ok: #3ddc84;
            --warn: #ffb300;
            --bad: #ff5252;
            --accent: #7aa2ff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 16px 14px 40px;
            background: var(--bg);
            color: var(--fg);
            font: 14px/1.5 system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
        }

        h1 {
            font-size: 17px;
            margin: 0 0 2px;
            letter-spacing: .3px;
        }

        .sub {
            color: var(--dim);
            font-size: 12px;
            margin-bottom: 14px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 12px;
        }

        .card h2 {
            font-size: 12px;
            color: var(--dim);
            font-weight: 600;
            margin: 0 0 10px;
            letter-spacing: .6px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, .05);
        }

        .row:last-child {
            border-bottom: 0;
        }

        .k {
            color: var(--dim);
            font-size: 13px;
        }

        .v {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 12px;
            background: var(--card2);
            border: 1px solid var(--line);
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--dim);
        }

        .up {
            color: var(--ok);
        }

        .up .dot {
            background: var(--ok);
            box-shadow: 0 0 8px var(--ok);
        }

        .down {
            color: var(--bad);
        }

        .down .dot {
            background: var(--bad);
        }

        .warn {
            color: var(--warn);
        }

        .warn .dot {
            background: var(--warn);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        button {
            appearance: none;
            border: 1px solid var(--line);
            background: var(--card2);
            color: var(--fg);
            border-radius: 11px;
            padding: 11px 8px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
        }

        button:active {
            background: #2a303b;
            transform: scale(.985);
        }

        button.primary {
            border-color: #3a4b78;
            background: #1c2740;
            color: #cfe0ff;
        }

        button.danger {
            border-color: #5a2a2a;
            background: #2a1717;
            color: #ffb3b3;
        }

        button.ghost {
            background: transparent;
        }

        .set {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, .05);
        }

        .set:last-of-type {
            border-bottom: 0;
        }

        input[type=number],
        select {
            background: var(--card2);
            border: 1px solid var(--line);
            color: var(--fg);
            border-radius: 9px;
            padding: 7px 10px;
            font: inherit;
            width: 108px;
            text-align: right;
        }

        pre {
            background: #0b0d11;
            border: 1px solid var(--line);
            border-radius: 11px;
            padding: 10px;
            font-size: 11.5px;
            line-height: 1.45;
            max-height: 240px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
            color: #b7c0d0;
            margin: 0;
        }

        .note {
            color: var(--dim);
            font-size: 11.5px;
            margin-top: 8px;
            line-height: 1.6;
        }

        .bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .bar button {
            flex: 1;
            padding: 9px;
            font-size: 12.5px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%) translateY(20px);
            background: #2b3240;
            border: 1px solid #3a4354;
            color: #fff;
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 12.5px;
            opacity: 0;
            transition: .25s;
            pointer-events: none;
            z-index: 9;
            max-width: 88vw;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%);
        }

        .dbg {
            display: none;
            margin: 10px 0 0;
            padding: 10px 12px;
            border-radius: 12px;
            background: #2a1b1b;
            border: 1px solid #5a2b2b;
            color: #ffb4b4;
            font-size: 12px;
            line-height: 1.5;
            word-break: break-all;
        }

        .dbg.show {
            display: block;
        }
    </style>
</head>

<body>
    <h1>DSHA 保活</h1>
    <div class="sub">keepalived 常驻守护</div>
    <div class="dbg" id="dbg"></div>

    <div class="card">
        <h2>运行状态</h2>
        <div class="row"><span class="k">守护进程</span><span id="s-daemon" class="pill"><i class="dot"></i><span>读取中</span></span></div>
        <div class="row"><span class="k">App 进程</span><span id="s-app" class="pill"><i class="dot"></i><span>—</span></span></div>
        <div class="row"><span class="k">前台服务</span><span id="s-fgs" class="pill"><i class="dot"></i><span>—</span></span></div>
        <div class="row"><span class="k">oom_score_adj</span><span id="s-oom" class="v">—</span></div>
        <div class="row"><span class="k">phantom 上限</span><span id="s-phantom" class="v">—</span></div>
        <div class="row"><span class="k">Doze 白名单</span><span id="s-doze" class="v">—</span></div>
        <div class="row"><span class="k">standby bucket</span><span id="s-standby" class="v">—</span></div>
        <div class="row"><span class="k">重启次数</span><span id="s-restarts" class="v">—</span></div>
        <div class="row"><span class="k">防护开关</span><span id="s-paused" class="pill"><i class="dot"></i><span>—</span></span></div>
    </div>

    <div class="card">
        <h2>操作</h2>
        <div class="grid">
            <button class="primary" onclick="act('start')">启动守护</button>
            <button onclick="act('restart')">重启守护</button>
            <button onclick="act('pause')">暂停防护</button>
            <button onclick="act('resume')">恢复防护</button>
            <button class="danger" onclick="act('stop')">停止守护</button>
            <button class="ghost" onclick="refresh()">刷新状态</button>
            <button class="ghost" onclick="diag()">诊断</button>
        </div>
        <div class="note">暂停后 app / 容器可被正常关闭，不会被拉起；恢复即重新生效。</div>
    </div>

    <div class="card">
        <h2>参数</h2>
        <div class="set"><span class="k">巡检间隔（秒）</span><input id="i-interval" type="number" min="5" max="300" /></div>
        <div class="set"><span class="k">oom_score_adj</span>
            <select id="i-oom">
                <option value="-1000">-1000 免疫</option>
                <option value="-900">-900</option>
                <option value="0">0 默认</option>
            </select>
        </div>
        <div class="set"><span class="k">保持前台服务</span>
            <select id="i-fgs">
                <option value="1">开</option>
                <option value="0">关</option>
            </select>
        </div>
        <div class="set"><span class="k">解除 phantom 限制</span>
            <select id="i-phantom">
                <option value="1">开</option>
                <option value="0">关</option>
            </select>
        </div>
        <div class="set"><span class="k">模块启用</span>
            <select id="i-enabled">
                <option value="1">启用</option>
                <option value="0">停用</option>
            </select>
        </div>
        <div class="bar" style="margin-top:12px">
            <button class="primary" onclick="save()">保存并重启守护</button>
        </div>
        <div class="bar">
            <button class="ghost" onclick="act('verify')">四道防线自检</button>
            <button class="danger" onclick="expert()">极硬模式</button>
        </div>
        <div class="note">极硬模式把 app 进程迁出 uid cgroup，系统「强行停止」将失效，重启后恢复。</div>
    </div>

    <div class="card">
        <h2>日志 <span style="float:right;color:var(--dim);font-weight:400" id="log-time"></span></h2>
        <pre id="logbox">读取中…</pre>
        <div class="bar" style="margin:8px 0 0">
            <button class="ghost" onclick="loadLog()">刷新日志</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        var MOD = "/data/adb/modules/dsha_keepalive";
        var api = window.ksu || window.ksud || null;

        function toast(msg) {
            var t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            clearTimeout(t._h);
            t._h = setTimeout(function() { t.classList.remove("show"); }, 2200);
        }

        var LAST = "";

        function norm(out) {
            if (out == null) return "";
            if (typeof out === "string") return out;
            if (typeof out === "object") {
                if (out.stdout != null) return String(out.stdout);
                if (out.out != null) return String(out.out);
                if (out.data != null) return String(out.data);
                try { return JSON.stringify(out); } catch (e) { return String(out); }
            }
            return String(out);
        }

        function sh(cmd) {
            return new Promise(function(res, rej) {
                if (!api || !api.exec) return rej(new Error("WebUI 未注入 ksu.exec"));
                var r;
                try { r = api.exec(cmd); } catch (e) { return rej(e); }
                Promise.resolve(r).then(function(out) {
                    var t = norm(out);
                    LAST = "type=" + (typeof out) + " len=" + t.length + " head=" + t.slice(0, 80).replace(/\n/g, " ");
                    res(t);
                }, rej);
            });
        }

        function dbg(msg) {
            var el = document.getElementById("dbg");
            if (!msg) { el.textContent = ""; el.classList.remove("show"); return; }
            el.textContent = msg;
            el.classList.add("show");
        }

        function diag() {
            sh("echo DSH_EXEC_OK").then(function(o) {
                var ok = (o || "").indexOf("DSH_EXEC_OK") >= 0;
                dbg("exec " + (ok ? "可用" : "返回异常") + "｜" + LAST);
            }).catch(function(e) {
                dbg("exec 失败：" + e.message);
            });
        }

        function parse(txt) {
            var o = {};
            (txt || "").split("\n").forEach(function(l) {
                var i = l.indexOf("=");
                if (i > 0) o[l.slice(0, i).trim()] = l.slice(i + 1).trim();
            });
            return o;
        }

        function pill(el, on, onText, offText, warnText) {
            var s = el.querySelector("span");
            el.classList.remove("up", "down", "warn");
            if (on === true) { el.classList.add("up"); s.textContent = onText; }
            else if (on === "warn") { el.classList.add("warn"); s.textContent = warnText || "注意"; }
            else { el.classList.add("down"); s.textContent = offText; }
        }

        function refresh() {
            sh("/system/bin/sh " + MOD + "/ctl.sh status").then(function(out) {
                var d = parse(out);
                if (!d.pkg) {
                    dbg("ctl.sh 没有输出｜" + LAST + "｜点「诊断」");
                    return;
                }
                dbg("");
                var daemonUp = d.daemon === "up";
                pill(document.getElementById("s-daemon"), daemonUp, "运行中 " + (d.daemon_pid || ""), "未运行");
                var appUp = d.app === "up";
                pill(document.getElementById("s-app"), appUp, "运行中 " + (d.app_pid || ""), "已退出");
                pill(document.getElementById("s-fgs"), d.fgs === "1" || d.fgs > "0", "已保活", "未启用");
                document.getElementById("s-oom").textContent = d.oom || "—";
                document.getElementById("s-phantom").textContent = d.phantom || "—";
                document.getElementById("s-doze").textContent = (d.doze == "0" ? "未加入" : "已加入");
                document.getElementById("s-standby").textContent = d.standby || "—";
                document.getElementById("s-restarts").textContent = d.restarts || "0";
                pill(document.getElementById("s-paused"), d.paused === "no", "生效中", "已暂停", "已暂停");

                document.getElementById("i-interval").value = d.interval || 20;
                document.getElementById("i-oom").value = d.oom_adj_cfg || "-1000";
                document.getElementById("i-fgs").value = d.force_fgs || "1";
                document.getElementById("i-phantom").value = d.phantom_limit_off || "1";
                document.getElementById("i-enabled").value = d.enabled || "1";
            }).catch(function(e) {
                toast("读取失败: " + e.message);
            });
        }

        function act(cmd) {
            sh("/system/bin/sh " + MOD + "/ctl.sh " + cmd).then(function(out) {
                toast((out || "").trim().split("\n").slice(-1)[0] || "完成");
                setTimeout(refresh, 800);
            }).catch(function(e) { toast("失败: " + e.message); });
        }

        function expert() {
            if (!confirm("极硬模式会让系统「强行停止」对该 app 失效，确定？")) return;
            sh("/system/bin/sh " + MOD + "/ctl.sh expert").then(function(out) { toast("已进入极硬模式"); });
        }

        function set(key, val) {
            return sh("/system/bin/sh " + MOD + "/ctl.sh set " + key + " " + val);
        }

        function save() {
            var jobs = [
                set("INTERVAL", document.getElementById("i-interval").value || 20),
                set("OOM_ADJ", document.getElementById("i-oom").value),
                set("FORCE_FGS", document.getElementById("i-fgs").value),
                set("DISABLE_PHANTOM_LIMIT", document.getElementById("i-phantom").value),
                set("ENABLED", document.getElementById("i-enabled").value)
            ];
            Promise.all(jobs).then(function() {
                toast("已保存");
                return sh("/system/bin/sh " + MOD + "/ctl.sh restart");
            }).then(function() {
                toast("守护已重启");
                setTimeout(refresh, 1500);
            }).catch(function(e) { toast("保存失败: " + e.message); });
        }

        function loadLog() {
            sh("/system/bin/sh " + MOD + "/ctl.sh log 60").then(function(out) {
                document.getElementById("logbox").textContent = out || "(空)";
                document.getElementById("log-time").textContent = new Date().toLocaleTimeString();
                document.getElementById("logbox").scrollTop = 1e9;
            }).catch(function(e) { document.getElementById("logbox").textContent = "读取失败: " + e.message; });
        }

        if (!api) {
            toast("当前管理器未注入 ksu API，UI 只读");
        }
        refresh();
        loadLog();
        setInterval(refresh, 5000);
    </script>
</body>

</html>
